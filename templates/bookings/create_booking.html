{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Confirm Booking</h1>

    <p>
        Service:
        {{ response.request.service.title }}
    </p>

    <p>
        Provider:
        {{ response.provider.business_name }}
    </p>

    <p>
        Price:
        R{{ response.price }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirm Booking
        </button>

    </form>

</div>

{% endblock %}
