{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Leave a Review</h1>

    <p>
        Service:
        {{ booking.request.service.title }}
    </p>

    <p>
        Provider:
        {{ booking.response.provider.business_name }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Rating</label>

        <select name="rating" required>

            <option value="">Select rating</option>
            <option value="1">1 - Very poor</option>
            <option value="2">2</option>
            <option value="3">3 - Average</option>
            <option value="4">4</option>
            <option value="5">5 - Excellent</option>

        </select>

        <br><br>

        <label>Comment</label>

        <textarea
            name="comment"
            rows="5"
        ></textarea>

        <br><br>

        <button type="submit">
            Submit Review
        </button>

    </form>

</div>

{% endblock %}
