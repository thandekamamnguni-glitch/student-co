{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Co{% endblock% }</title>

    <link rel="stylesheet" href="{%static 'css/style.css' %}"
</head>

<body>

    <header>
        <h1>Student Co</h1>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
<a href="{% url 'home' %}">
    Home
</a>

<a href="{% url 'service_list' %}">
    Services
</a>

{% if user.is_authenticated %}

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'profile' %}">
        Profile
    </a>

    <a href="{% url 'my_requests' %}">
        My Requests
    </a>

    <a href="{% url 'my_bookings' %}">
        My Bookings
    </a>

    <a href="{% url 'logout' %}">
        Logout
    </a>

{% else %}

    <a href="{% url 'login' %}">
        Login
    </a>

    <a href="{% url 'register' %}">
        Register
    </a>

{% endif %}



</body>
</html>
